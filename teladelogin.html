<!DOCTYPE html>
<html lang="en">
<head>
  <title>Tela de login</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container-fluid p-5 bg-primary text-white text-center">
    <h1>SoundHate</h1>
    </div>

<br>

<h2>Faça login</h2>

<br>

<form action="/login" method="POST">
    <div class="mb-3">
        <label class="form-label" for="inputEmail">Email</label>
        <input type="email" class="form-control" id="inputEmail" name="email" placeholder="Digite seu email" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="inputPassword">Senha</label>
        <input type="password" class="form-control" id="inputPassword" name="senha" placeholder="Digite sua senha" required>
    </div>
    <button type="submit" class="btn btn-primary">Entrar</button>
</form>

</body>
</html>
